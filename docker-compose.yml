version: '3.8'
services:
  backend:
    build: ./backend
    image: k1ttt3n/backend-image:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: k1ttt3n/frontend-image:latest
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
